[package]
name = "gear-tray"
version = "3.7.0"
edition = "2024"
authors = ["Difei Zhao", "Aaro Luomanen"]
description = "Windows tray battery indicator for a HyperX headset and Logitech mouse, with automatic audio output switching."
license = "GPL-3.0-only"
homepage = "https://github.com/dddd-zdf/gear-tray"
default-run = "gear-tray-debug"

[[bin]]
name = "gear-diagnostics"
path = "src/bin/diagnostics.rs"

[[bin]]
name = "gear-tray-debug"
path = "src/bin/debug.rs"

[dependencies]
anyhow = "1.0.102"
log = "0.4.22"
win32_notif = "0.15.2"
simplelog = { version = "0.12.2", features = ["paris"] }
tray-icon = "0.22.1"
winit = "0.30.12"
softbuffer = "0.4.8"
tiny-skia = "0.11.4"
fontdue = "0.9.3"
winreg = "0.56.0"
windows = { version = "0.58", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The `interface` macro used for IPolicyConfig expands to `::windows_core`.
windows-core = "0.58"

[build-dependencies]
winres = "0.1"
cc = { version = "1.2.61", features = ["jobserver"] }

[profile.release]
opt-level = "z"
lto = true
